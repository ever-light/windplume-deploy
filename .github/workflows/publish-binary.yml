name: Build, sign, and publish Linux release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      checks: write
      contents: read

  release:
    needs: quality
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release tag
        id: package
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
             [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must exactly match Cargo.toml version ${package_version}" >&2
            exit 1
          fi
          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"
          echo "archive=windplume-deploy-${tag_version}-linux-x86_64.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "signature=windplume-deploy-${tag_version}-linux-x86_64.sig" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain and musl linker
        run: |
          rustup toolchain install 1.96 --profile minimal --target "${TARGET}"
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-musl-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        env:
          WINDPLUME_BUILD_VERSION: ${{ steps.package.outputs.version }}
        run: cargo +1.96 build --locked --release --target "${TARGET}"

      - name: Sign release binary
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          SIGNATURE: ${{ steps.package.outputs.signature }}
        shell: bash
        run: |
          if [[ -z "${PRIVATE_KEY}" ]]; then
            echo "release environment secret RELEASE_SIGNING_PRIVATE_KEY_PEM is required" >&2
            exit 1
          fi
          signing_key="$(mktemp)"
          derived_public_key="$(mktemp)"
          trap 'rm -f -- "${signing_key}" "${derived_public_key}"' EXIT
          chmod 0600 "${signing_key}"
          printf '%s\n' "${PRIVATE_KEY}" > "${signing_key}"
          openssl pkey -in "${signing_key}" -pubout -out "${derived_public_key}"
          key_bits="$(openssl pkey -in "${signing_key}" -text -noout 2>/dev/null | \
            sed -n 's/.*Private-Key: (\([0-9][0-9]*\) bit.*/\1/p')"
          if [[ -z "${key_bits}" || "${key_bits}" -lt 3072 ]]; then
            echo "release signing key must be RSA 3072 bits or stronger" >&2
            exit 1
          fi
          if ! diff -q \
              <(openssl pkey -pubin -in deploy/release-signing-public.pem -pubout) \
              "${derived_public_key}" >/dev/null; then
            echo "release signing private key does not match the committed public key" >&2
            exit 1
          fi
          mkdir -p dist
          openssl dgst -sha256 -sign "${signing_key}" \
            -out "dist/${SIGNATURE}" "target/${TARGET}/release/windplume-deploy"
          openssl dgst -sha256 -verify deploy/release-signing-public.pem \
            -signature "dist/${SIGNATURE}" "target/${TARGET}/release/windplume-deploy"

      - name: Package release
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          package_dir="dist/windplume-deploy-${VERSION}-linux-x86_64"
          mkdir -p "${package_dir}"
          install -m 0755 "target/${TARGET}/release/windplume-deploy" \
            "${package_dir}/windplume-deploy"
          install -m 0644 README.md config.example.yaml \
            deploy/release-signing-public.pem \
            deploy/windplume-deploy.service \
            deploy/windplume-deploy-update.path \
            deploy/windplume-deploy-update.service "${package_dir}/"
          install -m 0755 deploy/windplume-deploy-update "${package_dir}/"
          install -m 0755 install.sh "${package_dir}/install.sh"
          tar -C dist -czf "dist/${ARCHIVE}" \
            "windplume-deploy-${VERSION}-linux-x86_64"
          (
            cd dist
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SIGNATURE: ${{ steps.package.outputs.signature }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            "dist/${SIGNATURE}" \
            --target "${GITHUB_SHA}" \
            --title "windplume-deploy ${VERSION}" \
            --generate-notes
